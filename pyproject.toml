[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "thermo-simulator"
version = "1.0.0"
description = "Thermodynamic cycle simulator: Carnot, Brayton, Rankine"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "coolprop>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["cycles", "utils", "tests", "cycles.*", "utils.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
